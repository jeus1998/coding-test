name: Notify Jeus Log
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger blog sync
        env:
          BLOG_SYNC_TOKEN: ${{ secrets.BLOG_SYNC_TOKEN }}
        run: |
          if [ -z "$BLOG_SYNC_TOKEN" ]; then
            echo "BLOG_SYNC_TOKEN is not configured; the blog's hourly sync remains available."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $BLOG_SYNC_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jeus1998/jeus1998.github.io/dispatches \
            -d '{"event_type":"coding-test-updated","client_payload":{"source":"jeus1998/coding-test"}}'
